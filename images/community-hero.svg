<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a3d62"/>
      <stop offset="100%" style="stop-color:#38ada9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <!-- People group -->
  <g transform="translate(200,140)">
    <!-- Person 1 (center) -->
    <circle cx="0" cy="-20" r="18" fill="#fff" opacity="0.95"/>
    <rect x="-14" y="2" width="28" height="35" rx="8" fill="#fff" opacity="0.9"/>
    <!-- Person 2 (left) -->
    <circle cx="-45" cy="-10" r="15" fill="#fff" opacity="0.8"/>
    <rect x="-57" y="8" width="24" height="30" rx="7" fill="#fff" opacity="0.75"/>
    <!-- Person 3 (right) -->
    <circle cx="45" cy="-10" r="15" fill="#fff" opacity="0.8"/>
    <rect x="33" y="8" width="24" height="30" rx="7" fill="#fff" opacity="0.75"/>
    <!-- Person 4 (far left) -->
    <circle cx="-80" cy="0" r="12" fill="#fff" opacity="0.6"/>
    <rect x="-90" y="14" width="20" height="26" rx="6" fill="#fff" opacity="0.55"/>
    <!-- Person 5 (far right) -->
    <circle cx="80" cy="0" r="12" fill="#fff" opacity="0.6"/>
    <rect x="70" y="14" width="20" height="26" rx="6" fill="#fff" opacity="0.55"/>
    <!-- Connection lines -->
    <line x1="-30" y1="-5" x2="-15" y2="-12" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="15" y1="-12" x2="30" y2="-5" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="-65" y1="0" x2="-45" y2="-5" stroke="#fff" stroke-width="2" opacity="0.2"/>
    <line x1="45" y1="-5" x2="65" y2="0" stroke="#fff" stroke-width="2" opacity="0.2"/>
  </g>
  <!-- EV icon -->
  <g transform="translate(200,220)">
    <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#fff" opacity="0.9"/>
    <circle cx="-12" cy="12" r="5" fill="#fff" opacity="0.8"/>
    <circle cx="12" cy="12" r="5" fill="#fff" opacity="0.8"/>
    <!-- Lightning bolt -->
    <polygon points="0,-18 4,-10 1,-10 3,-2 -1,2 0,-6 -3,-6" fill="#fff" opacity="0.95"/>
  </g>
  <!-- Speech bubbles -->
  <rect x="130" y="60" width="30" height="20" rx="8" fill="#fff" opacity="0.25"/>
  <circle cx="145" cy="88" r="3" fill="#fff" opacity="0.2"/>
  <rect x="240" y="50" width="25" height="18" rx="7" fill="#fff" opacity="0.2"/>
  <circle cx="252" cy="75" r="3" fill="#fff" opacity="0.15"/>
</svg>
